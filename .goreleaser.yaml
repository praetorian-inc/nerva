# GoReleaser configuration for Nerva
# https://goreleaser.com
version: 2

project_name: nerva

before:
  hooks:
    - go mod tidy

builds:
  - id: nerva
    main: ./cmd/nerva
    binary: nerva
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
      - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: praetorian-inc
    name: nerva
  draft: false
  prerelease: auto
  name_template: "Nerva v{{.Version}}"

sboms:
  - artifacts: archive

# cosign keyless OIDC signing of the checksums file. NOTE: these are the cosign
# v2 sign-blob flags. The central go-release.yml SHA-pins cosign via
# sigstore/cosign-installer@v3.8.2 (=> cosign v2.4.3, verified shipping .sig+.pem).
# cosign v3 replaces --output-certificate/--output-signature with a single
# --bundle=${signature} (.sigstore.json); migrate this stanza in lockstep IF/when
# the central workflow bumps cosign to v3.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
