# GoReleaser configuration for Nerva
# https://goreleaser.com
version: 2

project_name: nerva

before:
  hooks:
    - go mod tidy

builds:
  - id: nerva
    main: ./cmd/nerva
    binary: nerva
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
      - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: praetorian-inc
    name: nerva
  draft: false
  prerelease: auto
  name_template: "Nerva v{{.Version}}"

sboms:
  - artifacts: archive

# cosign keyless OIDC signing of checksums.txt — cosign v3 modern Sigstore
# .sigstore.json bundle. The central go-release.yml installs cosign v3 via
# cosign-installer v4.1.2; sign-blob --bundle is the v3 form (v2's
# --output-certificate/--output-signature were removed in cosign v3).
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
