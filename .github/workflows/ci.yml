name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci*'
      - 'Makefile'
      - 'pkg/plugins/oseol/data/**'
      - 'scripts/*lifecycle*'
      - '.github/workflows/ci.yml'
      - '.github/workflows/refresh-os-lifecycle.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lifecycle-refresh-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_update_lifecycle.py'

  ci:
    uses: praetorian-inc/public-workflows/.github/workflows/go-ci.yml@0c602372f3d0d038912dd08e159ecc83954a4995  # v2.9.3
    permissions:
      contents: read
    with:
      build-cmd-path: ./cmd/nerva
      build-binary-name: nerva
      # nerva's inline CI never ran golangci-lint; preserve that behavior here.
      # Enabling lint requires migrating .golangci.yml to v2 and fixing ~70
      # pre-existing issues in pkg/ (tracked separately).
      enable-lint: false
      # Preserve the old `go test -short` behavior so Docker-based service
      # tests (gated by testing.Short() in pkg/test/testutil.go) continue to
      # skip in CI. Dropping -short surfaces ~10 container-dependent tests.
      test-flags: -short -race -coverprofile=coverage.out -covermode=atomic
    secrets: inherit
