name: Refresh OS Lifecycle Data

on:
  schedule:
    - cron: '17 6 * * 1' # Weekly, Monday 06:17 UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-os-lifecycle
  cancel-in-progress: false

jobs:
  refresh:
    # Never run write-enabled automation from a dispatched feature branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main as the read-only baseline
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Test refresh validation without network access
        run: python3 -m unittest discover -s scripts -p 'test_update_lifecycle.py'

      - name: Fetch and validate all lifecycle feeds
        run: python3 scripts/update_lifecycle.py

      - name: Validate the embedded snapshot and scanner consumers
        env:
          GOWORK: 'off'
        run: |
          go test ./pkg/plugins/oseol ./pkg/plugins/services/http ./pkg/plugins/services/ssh ./pkg/plugins/services/snmp ./pkg/plugins/services/rdp -short -count=1
          go test ./pkg/scan -run '^TestPluginRunner_EnrichesSerializedOSResults$' -count=1

      # This action commits ONLY to the bot branch and opens/updates a PR.
      # No push to main, approval, merge, or auto-merge step is permitted here.
      - name: Propose lifecycle changes for human review
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/refresh-os-lifecycle
          add-paths: pkg/plugins/oseol/data/lifecycle.json
          commit-message: 'chore: refresh OS security-support lifecycle data'
          title: 'chore: refresh OS security-support lifecycle data'
          body: |
            Automated weekly refresh of the embedded OS lifecycle snapshot.

            **Human review required. This workflow does not merge or enable auto-merge.**

            - Review changed security-support dates and the recorded vendor/feed sources.
            - Confirm the selected support phase: no end-of-sale, feature-support, or paid-extension substitution.
            - Review Windows service-pack aggregation and Cisco device-scope limitations.
            - Generator validation and targeted scanner tests passed before opening this PR.
            - See `docs/os-lifecycle-data.md` for sources, licensing, and policy decisions.

            With GITHUB_TOKEN, this PR may not trigger other workflows automatically;
            maintainers must run required checks before merging. An approved merge
            still needs a Nerva release and Guard image/pin update to reach deployments.
