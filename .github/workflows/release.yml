name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    uses: praetorian-inc/public-workflows/.github/workflows/go-release.yml@9a72aee6f0e4cbf4bc0c9ccbd9160f6664e3549e  # v2.5.0
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      release-mode: auto-tag-from-main
    # Auto-tag every merge to main as the praetorian-ci-version-bumper App (a
    # creation-only bypass actor on the org Protected Version Tags ruleset), then
    # build + publish via GoReleaser using this repo's local .goreleaser.yaml.
    secrets:
      VERSION_BUMPER_APP_ID: ${{ secrets.VERSION_BUMPER_APP_ID }}
      VERSION_BUMPER_PRIVATE_KEY: ${{ secrets.VERSION_BUMPER_PRIVATE_KEY }}
